[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbackup"
version = "0.1.0"
description = "Web-based image-level backup and restore for VMware vSphere"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23",
    "cryptography>=42",
    "pydantic-settings>=2",
    "pyvmomi>=8",
    "zstandard>=0.22",
    "croniter>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
openbackup = "openbackup.cli:main"

[tool.setuptools.packages.find]
include = ["openbackup*"]

[tool.setuptools.package-data]
openbackup = ["web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Runs under the system Python 3.9 (RHEL's libguestfs bindings), not ours.
"openbackup/flr/guestfs_helper.py" = ["UP", "B905"]
