[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbackup"
version = "0.1.0"
description = "Image-level backup and restore for VMware vSphere"
requires-python = ">=3.12"
dependencies = [
    "pyvmomi>=9.0",
    "zstandard>=0.22",
    "click>=8.1",
    "rich>=13.0",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
# Explicit, because the working tree also holds directories that are not
# packages (a downloaded SDK, tests, docs).
include = ["openbackup*"]

[project.scripts]
openbackup = "openbackup.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
timeout = 300
