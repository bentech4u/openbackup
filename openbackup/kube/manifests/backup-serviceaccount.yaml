# OpenBackup backup account: read-only access for namespace backups.
#
#   oc apply -f backup-serviceaccount.yaml   (or let OpenBackup create it: Clusters > Add cluster)
#   oc -n openbackup get secret openbackup-backup-token -o jsonpath='{.data.token}' | base64 -d
#
# Paste that token into OpenBackup (Clusters > Add cluster > Backup token).
# cluster-reader can list every namespaced resource but cannot read Secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: openbackup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbackup-backup
  namespace: openbackup
---
apiVersion: v1
kind: Secret
metadata:
  name: openbackup-backup-token
  namespace: openbackup
  annotations:
    kubernetes.io/service-account.name: openbackup-backup
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-backup-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: openbackup-backup
    namespace: openbackup
---
# Application-level kinds cluster-reader cannot list: monitoring rules and
# targets an app defines in its own namespace, and image signature policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbackup-read-app-extras
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules", "probes",
                "alertmanagerconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.openshift.io"]
    resources: ["alertingrules", "alertrelabelconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["imagepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-backup-read-app-extras
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbackup-read-app-extras
subjects:
  - kind: ServiceAccount
    name: openbackup-backup
    namespace: openbackup
---
# Optional, only with OpenShift Virtualization: lets backups freeze guest
# filesystems (through the QEMU guest agent) while a VM's disks are
# snapshotted, for application-consistent VM backups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbackup-vm-freeze
rules:
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/freeze", "virtualmachineinstances/unfreeze"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-backup-vm-freeze
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbackup-vm-freeze
subjects:
  - kind: ServiceAccount
    name: openbackup-backup
    namespace: openbackup
