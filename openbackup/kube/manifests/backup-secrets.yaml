# Optional: lets the OpenBackup backup account read Secrets, for jobs that
# include them. Applied and removed through Clusters > Update permissions
# ("Allow reading Secrets"), or by hand:
#
#   oc apply -f backup-secrets.yaml
#
# OpenBackup only stores Secrets in encrypted repositories.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbackup-read-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-backup-read-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbackup-read-secrets
subjects:
  - kind: ServiceAccount
    name: openbackup-backup
    namespace: openbackup
