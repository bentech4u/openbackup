# OpenBackup restore account. Restoring recreates namespaces and everything
# in them, so this account is powerful. Store its token in OpenBackup only
# if you want restores without pasting it each time; otherwise paste it
# per restore and keep it out of OpenBackup entirely.
#
#   oc apply -f restore-serviceaccount.yaml
#   oc -n openbackup get secret openbackup-restore-token -o jsonpath='{.data.token}' | base64 -d
#
# Apply this on every cluster you restore INTO (e.g. the DR cluster).
apiVersion: v1
kind: Namespace
metadata:
  name: openbackup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbackup-restore
  namespace: openbackup
---
apiVersion: v1
kind: Secret
metadata:
  name: openbackup-restore-token
  namespace: openbackup
  annotations:
    kubernetes.io/service-account.name: openbackup-restore
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbackup-restore
rules:
  # Create the target namespace (with its original SCC UID range) and read
  # what already exists.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # The short-lived data mover pod uses the cluster's own CLI image.
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreamtags", "imagestreams"]
    verbs: ["get"]
  # Block-mode volumes (KubeVirt disks) are written by a mover pod that needs
  # raw device access.
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbackup-restore
subjects:
  - kind: ServiceAccount
    name: openbackup-restore
    namespace: openbackup
---
# Admin inside namespaces: everything a namespace backup contains.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbackup-restore-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openbackup-restore
    namespace: openbackup
