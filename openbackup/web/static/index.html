<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openbackup</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128190;</text></svg>">
</head>
<body>
<header>
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>openbackup</h1>
    <span class="badge" id="mode">read-only</span>
  </div>
  <div class="status" id="status"></div>
</header>

<div id="alerts"></div>

<section class="cards" id="cards"></section>

<nav class="tabs" role="tablist">
  <button role="tab" class="active" data-tab="vms">Virtual machines</button>
  <button role="tab" data-tab="points">Restore points</button>
  <button role="tab" data-tab="repo">Repository</button>
</nav>

<main>
  <section id="tab-vms" class="tab-panel active">
    <div class="toolbar">
      <input type="search" id="vm-filter" placeholder="Filter by name or guest">
      <label class="check"><input type="checkbox" id="only-unprotected"> Unprotected only</label>
      <button id="refresh-vms" class="ghost">Refresh inventory</button>
    </div>
    <div id="vms"></div>
  </section>

  <section id="tab-points" class="tab-panel">
    <div class="toolbar">
      <input type="search" id="point-filter" placeholder="Filter by VM name">
    </div>
    <div id="points"></div>
  </section>

  <section id="tab-repo" class="tab-panel">
    <div id="repo"></div>
  </section>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-inner">
    <button class="close" id="drawer-close" aria-label="Close">&times;</button>
    <div id="drawer-body"></div>
  </div>
</div>

<footer>
  <span id="footer-note"></span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
